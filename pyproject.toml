[project]
name = "ipi"
version = "0.1.0"
description = "Adaptive evaluation of system-level prompt-injection defenses + privilege-envelope runtime monitor (IIIT Kottayam BTP)"
requires-python = ">=3.10"
dependencies = [
  "agentdojo==0.1.35",   # pinned: results are only comparable at a fixed benchmark version
  "pyyaml",
  "pandas",
  "tabulate",
  # Progent authors' package (MIT), pinned: our progent defense wraps it rather than reimplementing it
  "secagent @ git+https://github.com/sunblaze-ucb/progent@5be7b63fa96f70bc19b72fbcee81f1c0bcc1a565",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
# CaMeL authors' package (Apache-2.0), pinned; its Q-LLM runs on pydantic-ai 1.x via our shim in defenses/camel.py
camel = [
  "camel @ git+https://github.com/google-research/camel-prompt-injection@f083b6b396399d3b3c7f2ddaf613a5945eaf32d8",
  "pydantic-ai-slim[anthropic]==2.56.0",
]

[project.scripts]
ipi = "ipi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ipi.defenses" = ["*.yaml"]
"ipi.defenses.envelope" = ["*.yaml"]
