# Real adaptive attack on a FREE tier: policy and envelope[llm] vs the LLM attacker, B = 10 (threat model), UCB.
run_name: free_adaptive_envelope
benchmark_version: v1.2.2
suites: [banking]
limit_user_tasks: 2
limit_injection_tasks: 2
model: {provider: openai-compat, name: gemini-3.5-flash}
defenses:
  - {name: envelope, extractor: llm, provider: openai-compat, model: gemini-3.5-flash, label: "envelope[llm]"}
attacks:
  - {name: adaptive, provider: openai-compat, model: gemini-3.5-flash, budget: 10, selection: ucb, defense_mode: auto,
     strategies: [living_off_the_land, envelope_generation, branch_steering], feedback_level: trace}
benign: false
escalation: deny
workers: 2
use_cache: true
