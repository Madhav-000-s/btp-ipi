  get_rating_reviews_for_hotels: {effect: read}
  get_hotels_address:    {effect: read}
  get_all_restaurants_in_city: {effect: read}
  get_cuisine_type_for_restaurants: {effect: read}
  get_restaurants_address: {effect: read}
  get_rating_reviews_for_restaurants: {effect: read}
  get_dietary_restrictions_for_all_restaurants: {effect: read}
  get_contact_information_for_restaurants: {effect: read}
  get_price_for_restaurants: {effect: read}
  check_restaurant_opening_hours: {effect: read}
  get_all_car_rental_companies_in_city: {effect: read}
  get_car_types_available: {effect: read}
  get_rating_reviews_for_car_rental: {effect: read}
  get_car_fuel_options:  {effect: read}
  get_car_rental_address: {effect: read}
  get_car_price_per_day: {effect: read}
  create_calendar_event: {effect: write_shared,  sinks: [participants], payload: [title, description, location, start_time, end_time]}
  search_calendar_events: {effect: read}
  get_day_calendar_events: {effect: read}
  cancel_calendar_event: {effect: destructive,   sinks: [event_id]}
  reserve_hotel:         {effect: financial,     sinks: [hotel], payload: [start_day, end_day]}
  reserve_car_rental:    {effect: financial,     sinks: [company], payload: [start_time, end_time]}
  reserve_restaurant:    {effect: financial,     sinks: [restaurant], payload: [start_time]}
