# Tool taxonomy for AgentDojo v1.2.x suites.
#
# effect: what kind of authority the call exercises. Ordered by severity:
#   read            - observes state, no side effects
#   write_self      - mutates user-owned state, nothing leaves the user's domain (create file, calendar event)
#   write_shared    - mutates state other principals can see (channel post, add participant, share file)
#   external_comm   - sends data to a principal (email, DM, webpage post)   <- exfiltration sink
#   financial       - moves money or commits to a purchase/reservation
#   account_admin   - changes credentials, identity, membership
#   destructive     - deletes or cancels
#
# sinks: arguments that name *who/what receives the effect* (recipient, IBAN, URL, user, file to share).
#        These are the args the envelope pins. Changing a sink is privilege expansion even if the tool is allowed.
# payload: arguments that carry content. Not pinned by default (content is where helpful 3rd-party
#          instructions legitimately flow), but logged and available to the checker.
#
# DEFENSE WORKSTREAM OWNS THIS FILE. Review every entry; it is a modelling decision and goes in the thesis.

workspace:
  send_email:            {effect: external_comm, sinks: [recipients, cc, bcc], payload: [subject, body, attachments]}
  delete_email:          {effect: destructive,   sinks: [email_id]}
  get_unread_emails:     {effect: read}
  get_sent_emails:       {effect: read}
  get_received_emails:   {effect: read}
  get_draft_emails:      {effect: read}
  search_emails:         {effect: read}
  search_contacts_by_name:  {effect: read}
  search_contacts_by_email: {effect: read}
  get_current_day:       {effect: read}
  search_calendar_events:   {effect: read}
  get_day_calendar_events:  {effect: read}
  create_calendar_event: {effect: write_shared,  sinks: [participants], payload: [title, description, location, start_time, end_time]}
  cancel_calendar_event: {effect: destructive,   sinks: [event_id]}
  reschedule_calendar_event: {effect: write_shared, sinks: [event_id], payload: [new_start_time, new_end_time]}
  add_calendar_event_participants: {effect: write_shared, sinks: [event_id, participants]}
  append_to_file:        {effect: write_self,    sinks: [file_id], payload: [content]}
  search_files_by_filename: {effect: read}
  create_file:           {effect: write_self,    payload: [filename, content]}
  delete_file:           {effect: destructive,   sinks: [file_id]}
  get_file_by_id:        {effect: read}
  list_files:            {effect: read}
  share_file:            {effect: external_comm, sinks: [file_id, email, permission]}
  search_files:          {effect: read}

