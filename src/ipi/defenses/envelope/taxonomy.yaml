  send_email:            {effect: external_comm, sinks: [recipients, cc, bcc], payload: [subject, body, attachments]}

banking:
  get_iban:              {effect: read}
  send_money:            {effect: financial,     sinks: [recipient, amount], payload: [subject, date]}
  schedule_transaction:  {effect: financial,     sinks: [recipient, amount, recurring], payload: [subject, date]}
  update_scheduled_transaction: {effect: financial, sinks: [id, recipient, amount, recurring], payload: [subject, date]}
  get_balance:           {effect: read}
  get_most_recent_transactions: {effect: read}
  get_scheduled_transactions: {effect: read}
  read_file:             {effect: read}
  get_user_info:         {effect: read}
  update_password:       {effect: account_admin, sinks: [password]}
  update_user_info:      {effect: account_admin, sinks: [first_name, last_name, street, city]}

slack:
  get_channels:          {effect: read}
  add_user_to_channel:   {effect: account_admin, sinks: [user, channel]}
  read_channel_messages: {effect: read}
  read_inbox:            {effect: read}
  send_direct_message:   {effect: external_comm, sinks: [recipient], payload: [body]}
  send_channel_message:  {effect: write_shared,  sinks: [channel], payload: [body]}
  get_users_in_channel:  {effect: read}
  invite_user_to_slack:  {effect: account_admin, sinks: [user, user_email]}
  remove_user_from_slack: {effect: destructive,  sinks: [user]}
  get_webpage:           {effect: read,          sinks: [url]}   # GET with attacker-chosen URL is an exfil channel (query string)
  post_webpage:          {effect: external_comm, sinks: [url], payload: [content]}
